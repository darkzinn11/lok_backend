name: Deploy Backend Lokcenter

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy-backend:
    name: Build and deploy backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build backend binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o lokcenter-api ./cmd/api

      - name: Prepare deploy package
        run: |
          mkdir -p deploy_backend
          cp lokcenter-api deploy_backend/
          cp -r migrations deploy_backend/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/lokcenter_actions
          chmod 600 ~/.ssh/lokcenter_actions
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload backend to VPS
        run: |
          rsync -avz --delete \
            --exclude ".env" \
            --exclude ".env.*" \
            -e "ssh -i ~/.ssh/lokcenter_actions -p ${{ secrets.VPS_PORT }}" \
            deploy_backend/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/apps/lokcenter/backend/"

      - name: Restart backend service
        run: |
          ssh -i ~/.ssh/lokcenter_actions -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo -n /usr/local/bin/deploy-lokcenter-backend"